name: Website

# Runs only when the landing page (apps/website) changes.
# Runs only on pushes to main (or when triggered manually): install, lint,
# typecheck and build, then build the production image
# (infra/docker/website.Dockerfile) and publish it to GitHub Container Registry.
on:
  push:
    branches: [main]
    paths:
      - apps/website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: apps/website/.next/cache
          key: website-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/website/src/**') }}
          restore-keys: website-next-${{ hashFiles('package-lock.json') }}-

      # Only the website's dependencies; fails if package-lock.json is out of sync.
      - run: npm ci --workspace @disc-voice/website --include-workspace-root=false
      - run: npm run lint --workspace @disc-voice/website
      - run: npm run typecheck --workspace @disc-voice/website
      - run: npm run build --workspace @disc-voice/website

  image:
    needs: check
    # O merge da PR de versão (`release(...)`, da skill /release) só roda as
    # verificações: a imagem não é publicada de novo só por mudar a versão.
    if: ${{ !startsWith(github.event.head_commit.message, 'release(') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/disc-voice-website
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/website.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optional repository variables with the installer links.
          build-args: |
            NEXT_PUBLIC_DOWNLOAD_WINDOWS=${{ vars.NEXT_PUBLIC_DOWNLOAD_WINDOWS }}
            NEXT_PUBLIC_DOWNLOAD_MAC=${{ vars.NEXT_PUBLIC_DOWNLOAD_MAC }}
            NEXT_PUBLIC_DOWNLOAD_LINUX=${{ vars.NEXT_PUBLIC_DOWNLOAD_LINUX }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
