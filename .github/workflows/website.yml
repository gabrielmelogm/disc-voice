name: Website

# Runs only when the landing page (apps/website) changes.
# Pull requests: install, lint, typecheck and build.
# Merges to main: build the production image (infra/docker/website.Dockerfile)
# and publish it to GitHub Container Registry.
on:
  push:
    branches: [main]
    paths:
      - apps/website/**
  pull_request:
    paths:
      - apps/website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: apps/website/.next/cache
          key: website-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/website/src/**') }}
          restore-keys: website-next-${{ hashFiles('package-lock.json') }}-

      # Only the website's dependencies; fails if package-lock.json is out of sync.
      - run: npm ci --workspace @disc-voice/website --include-workspace-root=false
      - run: npm run lint --workspace @disc-voice/website
      - run: npm run typecheck --workspace @disc-voice/website
      - run: npm run build --workspace @disc-voice/website

  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/disc-voice-website
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/website.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optional repository variables with the installer links.
          build-args: |
            NEXT_PUBLIC_DOWNLOAD_WINDOWS=${{ vars.NEXT_PUBLIC_DOWNLOAD_WINDOWS }}
            NEXT_PUBLIC_DOWNLOAD_MAC=${{ vars.NEXT_PUBLIC_DOWNLOAD_MAC }}
            NEXT_PUBLIC_DOWNLOAD_LINUX=${{ vars.NEXT_PUBLIC_DOWNLOAD_LINUX }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
