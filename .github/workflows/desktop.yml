name: Desktop

# - Pull request (or a manual run): lint + tests on Windows and Linux.
# - Push to main: also builds the Windows installer and the Linux packages
#   (AppImage, .deb, .rpm, .flatpak), unsigned, as workflow artifacts.
# - GitHub release published (by the /release skill or by hand in the Releases
#   tab): builds signed installers and publishes them: they are attached to the
#   release with one SHA256SUMS and uploaded to the private Lightsail bucket
#   under releases/, and the release notes get a "Qual arquivo baixar?"
#   section. The website's download buttons sign links to releases/latest/.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop/**
      - packages/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASES_BUCKET: disc-voice-files-481116707314
  RELEASES_REGION: sa-east-1
  # CI never rebuilds incrementally, and debug info is most of target/:
  # without it the cache is far smaller and faster to restore.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # Build and runtime libraries of the Linux app (WebKitGTK, tray, PulseAudio,
  # GStreamer for the camera and screen capture, cmake for the bundled Opus).
  # The GStreamer plugins are also what the AppImage bundles.
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
    libpulse-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl
    gstreamer1.0-pipewire cmake patchelf file xdg-utils

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache; releases and manual runs reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --all -- --check
      # disc-api has its own workflow (api.yml).
      - run: cargo clippy --workspace --exclude disc-api --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --exclude disc-api --locked

  # The Linux-only code (disc-call, the PulseAudio and GStreamer backends,
  # tray and WebKitGTK setup) is only compiled here. The TypeScript checks and
  # rustfmt are platform independent and run in the Windows job.
  # Ubuntu 22.04 (glibc 2.35) is also the oldest system the AppImage runs on.
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          # The runner's preinstalled libunwind-14-dev conflicts with the
          # libunwind-dev that libgstreamer1.0-dev needs.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri-build checks that the frontend dist folder exists.
      - run: mkdir -p apps/desktop/dist
      - run: cargo clippy --workspace --exclude disc-api --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --exclude disc-api --locked

  build-windows:
    needs: windows
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # A separate job gets its own cache key, holding only target/release.
      # main saves it; the release (on a tag) reuses it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set version from tag
        if: github.event_name == 'release'
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ./.github/scripts/set-version.ps1
      - name: Sign the installer for the self-update
        if: github.event_name == 'release'
        shell: pwsh
        run: ./.github/scripts/enable-updater-artifacts.ps1

      - run: npm ci
      # On a release the updater key signs the installer (.exe.sig); the app
      # only installs updates signed by it (pubkey in tauri.conf.json).
      - run: npm run build:windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      # Asset names without spaces (GitHub would turn "Disc Voice_..." into
      # "Disc.Voice_...").
      - name: Name the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'No installer found in target/release/bundle/nsis.' }
          $release = $env:GITHUB_EVENT_NAME -eq 'release'
          if ($release -and -not (Test-Path "$($exe.FullName).sig")) { throw 'No updater signature (.exe.sig) next to the installer.' }
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName "dist/DiscVoice_${version}_x64-setup.exe"
          if ($release) { Copy-Item "$($exe.FullName).sig" "dist/DiscVoice_${version}_x64-setup.exe.sig" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  build-linux:
    needs: linux
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          # The runner's preinstalled libunwind-14-dev conflicts with the
          # libunwind-dev that libgstreamer1.0-dev needs.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set version from tag
        if: github.event_name == 'release'
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ./.github/scripts/set-version.ps1
      # Only the AppImage updates itself; .deb and .rpm go through the package manager.
      - name: Sign the AppImage for the self-update
        if: github.event_name == 'release'
        shell: pwsh
        run: ./.github/scripts/enable-updater-artifacts.ps1

      - run: npm ci
      # AppImage, .deb and .rpm from one compile. linuxdeploy is itself an
      # AppImage; the runners have no FUSE.
      - run: npm run build:linux:all
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: Name the Linux packages
        run: |
          shopt -s nullglob
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          mkdir -p dist
          pick() {
            local files=(target/release/bundle/$1/*.$2)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No .$2 found in target/release/bundle/$1." >&2
              exit 1
            fi
            cp "${files[0]}" "dist/$3"
          }
          pick appimage AppImage "DiscVoice_${version}_x86_64.AppImage"
          pick deb deb "DiscVoice_${version}_amd64.deb"
          pick rpm rpm "DiscVoice_${version}_x86_64.rpm"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            pick appimage AppImage.sig "DiscVoice_${version}_x86_64.AppImage.sig"
          fi
          chmod +x dist/*.AppImage
          ls -lh dist >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # Repackages the .deb's binary in the GNOME runtime, which ships the same
  # libraries the AppImage bundles (apps/desktop/flatpak/dev.discvoice.desktop.yml).
  build-flatpak:
    needs: build-linux
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - name: Use the .deb of this build
        run: |
          deb=$(ls linux/DiscVoice_*_amd64.deb | head -n 1)
          if [ -z "$deb" ]; then
            echo 'No .deb in the linux artifact.' >&2
            exit 1
          fi
          version=${deb#linux/DiscVoice_}
          version=${version%_amd64.deb}
          cp "$deb" apps/desktop/flatpak/disc-voice.deb
          echo "BUNDLE=DiscVoice_${version}_x86_64.flatpak" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: apps/desktop/flatpak/dev.discvoice.desktop.yml
          bundle: ${{ env.BUNDLE }}
          # Only the tray library is compiled; it changes with these files.
          cache-key: flatpak-${{ hashFiles('apps/desktop/flatpak/shared-modules/**') }}
          upload-artifact: false
      - run: ls -lh "$BUNDLE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux, build-flatpak]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS lists every file, so a download can be checked.
      - name: Attach installers and checksums to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $appimage = Get-ChildItem dist/*.AppImage | Select-Object -First 1
          $deb = Get-ChildItem dist/*.deb | Select-Object -First 1
          $rpm = Get-ChildItem dist/*.rpm | Select-Object -First 1
          $flatpak = Get-ChildItem dist/*.flatpak | Select-Object -First 1
          if (-not $installer -or -not $appimage -or -not $deb -or -not $rpm -or -not $flatpak) { throw 'Missing build artifacts.' }
          $packages = @($installer, $appimage, $deb, $rpm, $flatpak)

          $lines = foreach ($file in $packages) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          $sums = 'dist/SHA256SUMS'
          # sha256sum format (two spaces), LF, no BOM: `sha256sum -c` reads it.
          [IO.File]::WriteAllText($sums, (($lines -join "`n") + "`n"))

          gh release upload $env:TAG @($packages.FullName) $sums --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Upload to the release failed.' }
          "INSTALLER=$($installer.FullName)" >> $env:GITHUB_ENV
          "INSTALLER_SHA256=$((Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_ENV
          "APPIMAGE=$($appimage.FullName)" >> $env:GITHUB_ENV
          "DEB=$($deb.FullName)" >> $env:GITHUB_ENV
          "RPM=$($rpm.FullName)" >> $env:GITHUB_ENV
          "FLATPAK=$($flatpak.FullName)" >> $env:GITHUB_ENV
          foreach ($file in @($installer, $appimage)) {
            if (-not (Test-Path "$($file.FullName).sig")) { throw "Missing the updater signature of $($file.Name)." }
          }
          "INSTALLER_SIG=$($installer.FullName).sig" >> $env:GITHUB_ENV
          "APPIMAGE_SIG=$($appimage.FullName).sig" >> $env:GITHUB_ENV

      # The website's download button signs releases/latest/. It gets this
      # release when it is stable, or a prerelease while no stable exists yet
      # (the project is in alpha), and never an older version than the newest.
      - name: Decide whether the website gets this release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --exclude-drafts --json tagName,isPrerelease | ConvertFrom-Json
          $hasStable = @($releases | Where-Object { -not $_.isPrerelease }).Count -gt 0
          $latest = ($env:PRERELEASE -ne 'true') -or (-not $hasStable)

          # Newest semver release (tags that are not semver, like "Alpha", are ignored).
          $semver = '^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$'
          $newest = $releases | Where-Object { $_.tagName -match $semver } | ForEach-Object {
            $null = $_.tagName -match $semver
            # A stable sorts after its prereleases (alpha, beta, rc); numbers are
            # padded so alpha.10 > alpha.9.
            $pre = if ($Matches[4]) { $Matches[4] -replace '\d+', { '{0:D6}' -f [int]$_.Value } } else { 'zzzzzz' }
            [pscustomobject]@{ Tag = $_.tagName; Key = '{0:D6}.{1:D6}.{2:D6}-{3}' -f [int]$Matches[1], [int]$Matches[2], [int]$Matches[3], $pre }
          } | Sort-Object Key -Descending | Select-Object -First 1
          if ($newest -and $newest.Tag -ne $env:TAG) {
            "$env:TAG is not the newest release ($($newest.Tag)); the website keeps its download." >> $env:GITHUB_STEP_SUMMARY
            $latest = $false
          }
          "UPDATE_LATEST=$($latest.ToString().ToLower())" >> $env:GITHUB_ENV

      # Same access key the API uses (see infra/terraform/README.md, "Releases").
      # The object names are fixed: the website's /download/* routes sign them
      # (apps/website/src/lib/releases.ts).
      - name: Upload installers to the bucket
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FILES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.RELEASES_REGION }}
        run: |
          $base = "s3://$env:RELEASES_BUCKET/releases"
          $files = @(
            @{ Path = $env:INSTALLER; Name = 'DiscVoice-Setup.exe'; Type = 'application/vnd.microsoft.portable-executable' },
            @{ Path = $env:APPIMAGE; Name = 'DiscVoice_x86_64.AppImage'; Type = 'application/vnd.appimage' },
            @{ Path = $env:DEB; Name = 'DiscVoice_amd64.deb'; Type = 'application/vnd.debian.binary-package' },
            @{ Path = $env:RPM; Name = 'DiscVoice_x86_64.rpm'; Type = 'application/x-rpm' },
            @{ Path = $env:FLATPAK; Name = 'DiscVoice_x86_64.flatpak'; Type = 'application/vnd.flatpak' }
          )

          # The objects stay private: the website signs a short-lived link.
          # Versioned copy, kept for good; latest/ is what the website serves.
          $folders = @($env:TAG) + $(if ($env:UPDATE_LATEST -eq 'true') { 'latest' } else { @() })
          foreach ($folder in $folders) {
            foreach ($file in $files) {
              aws s3 cp $file.Path "$base/$folder/$($file.Name)" --content-type $file.Type
              if ($LASTEXITCODE -ne 0) { throw "Upload of $($file.Name) failed." }
              "Uploaded $base/$folder/$($file.Name)" >> $env:GITHUB_STEP_SUMMARY
            }
          }
          # Kept with the versioned copy; the update manifests embed them too.
          foreach ($sig in @(@{ Path = $env:INSTALLER_SIG; Name = 'DiscVoice-Setup.exe.sig' }, @{ Path = $env:APPIMAGE_SIG; Name = 'DiscVoice_x86_64.AppImage.sig' })) {
            aws s3 cp $sig.Path "$base/$env:TAG/$($sig.Name)" --content-type text/plain
            if ($LASTEXITCODE -ne 0) { throw "Upload of $($sig.Name) failed." }
          }

      # Installed apps learn of the update from the API (realtime), or from the
      # website's /api/update/latest at their next check; the website signs a
      # link to the installer in releases/<tag>/ only when the user clicks to
      # update (apps/website/src/lib/updates.ts).
      - name: Publish the self-update manifests and tell open apps
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUB_DATE: ${{ github.event.release.published_at }}
          API_URL: https://discvoice.devgabrielmelo.shop/api
          RELEASE_NOTIFY_TOKEN: ${{ secrets.RELEASE_NOTIFY_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FILES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.RELEASES_REGION }}
        run: ./.github/scripts/publish-update-manifests.ps1

      # Appends "Qual arquivo baixar?" to the notes, whether the release came
      # from the /release skill or was written by hand in the Releases tab.
      # Re-running the job replaces the section instead of repeating it.
      - name: Add the download section to the release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: https://get-discvoice.devgabrielmelo.shop
        run: |
          $marker = '<!-- downloads -->'
          $body = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json body -q .body
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the release.' }
          $body = (($body -join "`n") -split [regex]::Escape($marker))[0].TrimEnd()

          $file = Split-Path $env:INSTALLER -Leaf
          $image = Split-Path $env:APPIMAGE -Leaf
          $deb = Split-Path $env:DEB -Leaf
          $rpm = Split-Path $env:RPM -Leaf
          $flatpak = Split-Path $env:FLATPAK -Leaf
          $site = if ($env:UPDATE_LATEST -eq 'true') {
            "O botão de download do [site]($env:SITE) já entrega esta versão para Windows e Linux."
          } else {
            "Esta versão não substitui o download do [site]($env:SITE): baixe o instalador aqui."
          }
          $section = @(
            $marker,
            '## Qual arquivo baixar?',
            '',
            '| Sistema | Download |',
            '| --- | --- |',
            "| Windows 10/11 (x64) | ``$file``, o instalador |",
            "| Linux (x86_64), qualquer distro | ``$image``: dê permissão de execução (``chmod +x``) e abra |",
            "| Ubuntu, Debian, Mint, Pop!_OS | ``$deb``: ``sudo apt install ./$deb`` |",
            "| Fedora, RHEL, openSUSE | ``$rpm``: ``sudo dnf install ./$rpm`` |",
            "| Linux com Flatpak (Bazzite, Silverblue, SteamOS...) | ``$flatpak``: ``flatpak install --user ./$flatpak`` |",
            "| macOS | Sem app nativo: use a versão web em [$($env:SITE -replace '^https://', '')]($env:SITE) |",
            '',
            "$site Atualizar pelo instalador mantém sua conta e suas configurações.",
            '',
            "Para conferir o download: ``sha256sum -c --ignore-missing SHA256SUMS`` ou, no PowerShell, ``(Get-FileHash '$file').Hash`` (SHA-256: ``$env:INSTALLER_SHA256``)."
          ) -join "`n"

          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          [IO.File]::WriteAllText($notes, ($(if ($body) { "$body`n`n" } else { '' }) + $section + "`n"))
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the release notes.' }
