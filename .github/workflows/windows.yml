name: Windows

# Pushes to main (or a manual run) only run lint + tests. The installer is
# built only when a GitHub release is published: it is attached to the release
# and uploaded to the private Lightsail bucket under releases/; the website's
# download button signs a link to releases/latest/DiscVoice-Setup.exe.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/windows.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASES_BUCKET: disc-voice-files-481116707314
  RELEASES_REGION: sa-east-1

jobs:
  desktop:
    # No push da PR de versão (`release(...)`, da skill /release) não roda: o
    # build vem quando a release é publicada, e aí este job roda de novo.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release(') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # CI never rebuilds incrementally, and debug info is most of target/:
      # without it the cache is far smaller and faster to restore.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache; releases and manual runs reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --all -- --check
      # disc-api has its own workflow (api.yml).
      - run: cargo clippy --workspace --exclude disc-api --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --exclude disc-api --locked

  release:
    needs: desktop
    if: github.event_name == 'release'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # A separate job gets its own cache key, holding only target/release.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      # The installer carries the release version: tag v1.2.3 -> 1.2.3.
      - name: Set version from tag
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$env:TAG' is not a semver version (e.g. v1.2.3)."
          }
          $path = 'apps/desktop/src-tauri/tauri.conf.json'
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 32 | Set-Content $path -Encoding utf8

      - run: npm ci
      - run: npm run build:windows

      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'No installer found in target/release/bundle/nsis.' }
          gh release upload $env:TAG $exe.FullName --clobber
          "INSTALLER=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Same access key the API uses (see infra/terraform/README.md, "Releases").
      - name: Upload installer to the bucket
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FILES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.RELEASES_REGION }}
        run: |
          $base = "s3://$env:RELEASES_BUCKET/releases"
          $name = 'DiscVoice-Setup.exe'
          $type = 'application/vnd.microsoft.portable-executable'

          # The objects stay private: the website signs a short-lived link.
          # Versioned copy, kept for good.
          aws s3 cp $env:INSTALLER "$base/$env:TAG/$name" --content-type $type
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed.' }
          "Uploaded $base/$env:TAG/$name" >> $env:GITHUB_STEP_SUMMARY

          # Key the website's download button signs; prereleases never replace it.
          if ($env:PRERELEASE -ne 'true') {
            aws s3 cp $env:INSTALLER "$base/latest/$name" --content-type $type
            if ($LASTEXITCODE -ne 0) { throw 'Upload failed.' }
            "Uploaded $base/latest/$name" >> $env:GITHUB_STEP_SUMMARY
          }
