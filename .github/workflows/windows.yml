name: Windows

# Runs only on pushes to main (or when triggered manually): lint + tests first,
# then the full Windows build (and its installer artifact) in a separate job
# so its release artifacts never bloat the checks' cache.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # CI never rebuilds incrementally, and debug info is most of target/:
      # without it the cache is far smaller and faster to restore.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache; manual runs on other branches reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --all -- --check
      # disc-api has its own workflow (api.yml).
      - run: cargo clippy --workspace --exclude disc-api --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --exclude disc-api --locked

  release:
    needs: desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # A separate job gets its own cache key, holding only target/release.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: disc-voice-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
