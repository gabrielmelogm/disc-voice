name: Windows

# Pull requests only install dependencies and run lint + tests, so review
# feedback comes back fast. The full Windows build (and its installer
# artifact) only runs on pushes to main or when triggered manually.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache; PRs reuse it without writing their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Install + checks (every PR and push to main)
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # Build (push to main / manual only)
      - if: github.event_name != 'pull_request'
        run: npm run build:windows
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: disc-voice-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
