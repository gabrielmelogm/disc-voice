name: API

# Tests the API, then deploys it to the Lightsail host (infra/docker/prod)
# when the tests pass on main.
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - Cargo.toml
      - Cargo.lock
      - infra/docker/api.Dockerfile
      - infra/docker/prod/**
      - .github/workflows/api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: discvoice
          POSTGRES_PASSWORD: discvoice_test
          POSTGRES_DB: discvoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discvoice -d discvoice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://discvoice:discvoice_test@127.0.0.1:5432/discvoice_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache; PRs reuse it without writing their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p disc-api --all-targets --locked -- -D warnings
      - run: cargo test -p disc-api --locked --test api -- --ignored --test-threads=1

  deploy:
    needs: postgres
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the running one.
    concurrency:
      group: api-deploy-production
      cancel-in-progress: false
    env:
      HOST: ${{ vars.LIGHTSAIL_HOST }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      IMAGE: disc-voice-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built on the runner: the 2 GB instance cannot compile the API.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload image and stack files
        run: |
          docker save "$IMAGE" | gzip -1 | ssh "ubuntu@$HOST" 'gunzip | docker load'
          scp infra/docker/prod/compose.yaml infra/docker/prod/Caddyfile "ubuntu@$HOST:/opt/disc-voice/"
      # The .env only exists on the server; secrets kept in GitHub are written
      # into it here. The value goes through stdin, never on a command line.
      - name: Sync secrets to the server .env
        env:
          KLIPY_TOKEN: ${{ secrets.KLIPY_TOKEN }}
        run: |
          if [ -z "$KLIPY_TOKEN" ]; then
            echo "::warning::Secret KLIPY_TOKEN is not set; the server keeps its current value (GIFs may be off)."
            exit 0
          fi
          # Single quotes: everything runs on the server, reading the value from stdin.
          printf '%s' "$KLIPY_TOKEN" | ssh "ubuntu@$HOST" 'set -euo pipefail; value=$(cat); cd /opt/disc-voice; umask 077; touch .env; { grep -v "^KLIPY_TOKEN=" .env || true; printf "KLIPY_TOKEN=%s\n" "$value"; } > .env.tmp; mv .env.tmp .env'
      - name: Switch to the new version
        run: |
          ssh "ubuntu@$HOST" IMAGE="$IMAGE" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/disc-voice
          # Keep the running image for a rollback.
          if docker image inspect disc-voice-api:prod >/dev/null 2>&1; then
            docker tag disc-voice-api:prod disc-voice-api:previous
          fi
          docker tag "$IMAGE" disc-voice-api:prod
          docker compose up -d --remove-orphans
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          EOF
      - name: Health check (rolls back on failure)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$PUBLIC_URL/api/health" >/dev/null; then
              echo "Healthy after $i attempt(s)"
              exit 0
            fi
            sleep 4
          done
          echo "::error::$PUBLIC_URL/api/health did not respond; rolling back"
          ssh "ubuntu@$HOST" 'cd /opt/disc-voice && docker compose logs --tail 50 api; docker tag disc-voice-api:previous disc-voice-api:prod && docker compose up -d api'
          exit 1
      - name: Remove old images
        if: success()
        run: |
          ssh "ubuntu@$HOST" IMAGE="$IMAGE" bash -s <<'EOF'
          docker images --format '{{.Repository}}:{{.Tag}}' disc-voice-api \
            | grep -vE ":(prod|previous)$" | grep -vF "$IMAGE" | xargs -r docker rmi
          docker image prune -f
          EOF
