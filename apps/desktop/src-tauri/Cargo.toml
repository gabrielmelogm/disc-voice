[package]
name = "disc-voice-desktop"
version = "0.1.0"
description = "Comunidades, servidores e dispositivos de voz e vídeo para Windows e Linux"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri = { version = "2", features = [] }
disc-audio = { path = "../../../packages/audio-engine" }
disc-video = { path = "../../../packages/video-engine" }

[target.'cfg(target_os = "linux")'.dependencies]
disc-call = { path = "../../../packages/call-engine" }
serde_json = "1"
webkit2gtk = { version = "2.0", features = ["v2_38"] }
