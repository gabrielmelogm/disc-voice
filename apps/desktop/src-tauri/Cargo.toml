[package]
name = "disc-voice-desktop"
version = "0.1.0-alpha.2"
description = "Comunidades, servidores e dispositivos de voz e vídeo para Windows e Linux"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Opening the app again while it runs in the tray brings back that window.
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
# Google Sign-In: a loopback server for the OAuth redirect, and the system browser.
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
disc-audio = { path = "../../../packages/audio-engine" }
disc-video = { path = "../../../packages/video-engine" }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
disc-call = { path = "../../../packages/call-engine" }
webkit2gtk = { version = "2.0", features = ["v2_38"] }
# Checks for the AppIndicator library before the tray uses it (it panics without it).
libloading = "0.8"
