name: disc-voice
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: discvoice
      POSTGRES_USER: discvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discvoice_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discvoice -d discvoice"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://discvoice:${POSTGRES_PASSWORD:-discvoice_local}@db:5432/discvoice
      API_BIND: 0.0.0.0:3001
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3001}
      WEB_DIST: /app/web
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:1420,http://127.0.0.1:1420,https://tauri.localhost,http://tauri.localhost,tauri://localhost}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
