[package]
name = "disc-call"
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.85"
description = "Native WebRTC voice calls and screen sharing for Linux, where WebKitGTK ships without RTCPeerConnection"

[target.'cfg(target_os = "linux")'.dependencies]
async-trait = "0.1"
bytes = "1"
disc-audio = { path = "../audio-engine" }
disc-video = { path = "../video-engine" }
jpeg-encoder = { version = "0.6", features = ["simd"] }
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
openh264 = "0.9"
opus = "0.4"
rtc = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
webrtc = "0.21"
